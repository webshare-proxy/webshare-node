name: Release

# Publishes @webshare-proxy/sdk to npm when a version tag is pushed.
# Tag format: v1.2.3 (must match the version in package.json).
#
# Auth uses npm OIDC Trusted Publishing — there is NO token to store. npm mints a
# short-lived credential from the GitHub OIDC token at publish time, and adds a
# provenance attestation automatically.
# One-time setup on npmjs.com (after the package's first publish exists):
#   Package → Settings → Trusted Publisher → GitHub Actions
#   owner: webshare-proxy  repo: webshare-node  workflow: release.yml  environment: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm to an OIDC-capable version
        run: npm install -g npm@latest

      - run: npm ci

      # Fail early if the tag and the package.json version disagree.
      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - run: npm run build
      - run: npm test
      - run: npm run smoke

      # No NODE_AUTH_TOKEN: publishConfig sets access:public + provenance:true,
      # and npm authenticates via OIDC because id-token:write is granted above.
      - name: Publish
        run: npm publish
